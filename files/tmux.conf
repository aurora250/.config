# ============================================================
#  tmux 配置
#
#  要求: tmux >= 3.3
# ============================================================


# ------------------------------------------------------------
#  一、基础项
# ------------------------------------------------------------
set -g mouse on

# vim/neovim 用户必加: 默认 500ms 的 ESC 延迟会让模式切换发粘
set -s escape-time 0

# 让 vim/nvim 感知焦点变化（autoread、自动保存等依赖它）
set -s focus-events on

set -sg repeat-time 300
set -g history-limit 10000
set -g allow-passthrough on

# 让 tmux 把选区/复制内容通过 OSC 52 送到终端剪贴板
set -g set-clipboard on

# 关掉窗口时不连带杀掉整个会话
set -g detach-on-destroy off
set -sg exit-empty on

# 安静模式: 不要因为别的窗口有输出就报警
set -g visual-activity off
setw -g monitor-activity off
setw -g monitor-bell off

# xterm 扩展键 + 扩展键协议
setw -g xterm-keys on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -q -g status-utf8 on
setw -q -g utf8 on

set -g default-shell /bin/zsh
set -gu default-command


# ------------------------------------------------------------
#  二、窗口/窗格索引与命名
# ------------------------------------------------------------
# base-index 1: 和浏览器标签页/终端标签的肌肉记忆一致
set -g base-index 1
setw -g pane-base-index 1

# 关掉窗口后自动重新编号，不留空号
set -g renumber-windows on

setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'


# ------------------------------------------------------------
#  三、彩色
# ------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*256col*:RGB"
set -as terminal-overrides ",*256col*:Tc"


# ------------------------------------------------------------
#  四、环境变量透传
# ------------------------------------------------------------
set -ga update-environment '\
DISPLAY WAYLAND_DISPLAY \
DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR \
XDG_SESSION_TYPE XDG_CURRENT_DESKTOP \
SSH_AUTH_SOCK \
FZF_DEFAULT_OPTS FZF_DEFAULT_COMMAND \
TERM TERM_PROGRAM \
'


# ------------------------------------------------------------
#  五、前缀键
# ------------------------------------------------------------
unbind C-b
set -g prefix C-s

# 连按两次前缀，可以向窗格发送字面 C-s
bind C-s send-prefix


# ------------------------------------------------------------
#  六、Alt 无前缀导航
#  方向映射: n=左 i=右 u=上 e=下
# ------------------------------------------------------------
bind -n M-n select-pane -L
bind -n M-e select-pane -D
bind -n M-u select-pane -U
bind -n M-i select-pane -R

bind -n M-N resize-pane -L 3
bind -n M-E resize-pane -D 3
bind -n M-U resize-pane -U 3
bind -n M-I resize-pane -R 3

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-l previous-window
bind -n M-y next-window

bind -n M-o new-window -c '#{pane_current_path}'
bind -n M-Q kill-pane
bind -n M-f resize-pane -Z
bind -n M-v copy-mode


# ------------------------------------------------------------
#  七、窗口管理
# ------------------------------------------------------------
bind -r C-p previous-window
bind -r C-n next-window

unbind n
unbind p
bind n split-window -h -b -c '#{pane_current_path}'
bind i split-window -h    -c '#{pane_current_path}'
bind u split-window -v -b -c '#{pane_current_path}'
bind e split-window -v    -c '#{pane_current_path}'

bind C-c new-session
bind . command-prompt -p "重命名会话:" "rename-session '%%'"
unbind ,
bind , command-prompt -p "重命名窗口:" "rename-window '%%'"

bind > swap-pane -D
bind < swap-pane -U
bind | swap-pane

# choose-tree: W 浏览 / S 竖向移动窗格 / V 横向移动窗格
bind W choose-tree -Z
bind S choose-tree 'move-pane -v -s "%%"'
bind V choose-tree 'move-pane -h -s "%%"'

bind b list-buffers
bind p paste-buffer


# ------------------------------------------------------------
#  八、同步输入窗格
# ------------------------------------------------------------
bind C-g if-shell -F '#{synchronize-panes}' \
  'setw synchronize-panes off ; set -g pane-active-border-style fg=#b294bb' \
  'setw synchronize-panes on  ; set -g pane-active-border-style fg=red'


# ------------------------------------------------------------
#  九、copy-mode
# ------------------------------------------------------------
set -g status-keys emacs
set -g mode-keys vi

bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi n   send-keys -X cursor-left
bind -T copy-mode-vi i   send-keys -X cursor-right
bind -T copy-mode-vi u   send-keys -X cursor-up
bind -T copy-mode-vi e   send-keys -X cursor-down
bind -T copy-mode-vi U   send-keys -N 5 -X cursor-up
bind -T copy-mode-vi E   send-keys -N 5 -X cursor-down
bind -T copy-mode-vi N   send-keys -X start-of-line
bind -T copy-mode-vi I   send-keys -X end-of-line
bind -T copy-mode-vi h   send-keys -X next-word-end
bind -T copy-mode-vi Y   send-keys -X copy-end-of-line
bind -T copy-mode-vi =   send-keys -X search-again
bind -T copy-mode-vi C-u send-keys -N 5 -X scroll-up
bind -T copy-mode-vi C-e send-keys -N 5 -X scroll-down
unbind -T copy-mode-vi C-u
unbind -T copy-mode-vi C-e
bind -T copy-mode-vi C-u send-keys -N 5 -X scroll-up
bind -T copy-mode-vi C-e send-keys -N 5 -X scroll-down

bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel


# ------------------------------------------------------------
#  十、窗格标题栏
# ------------------------------------------------------------
setw -g pane-border-status top
set -g pane-border-format ' #[fg=colour244]#{pane_index} #[fg=#c5c8c6]#{pane_current_command} #[fg=colour240]#{b:pane_current_path} '
set -g pane-active-border-style 'fg=#b294bb'
set -g pane-border-style 'fg=colour238'


# ------------------------------------------------------------
#  十一、双行状态栏
#
#  第 0 行（上）: 会话名 / 缩放提示 / 当前窗格路径
#  第 1 行（下）: 窗口列表 + 时间
# ------------------------------------------------------------
set -g status on
set -g status 2
set -g status-justify left
set -g status-interval 5
set -g status-left-length 90
set -g status-right-length 150
setw -g window-status-separator ''

set -g status-style 'bg=default,fg=default'
setw -g window-status-format         '#[fg=#c5c8c6] #I:#W '
setw -g window-status-current-format '#[fg=#b294bb,bold] #I:#W '
setw -g window-status-activity-style 'bg=default'

set -g status-left  '#[fg=#b294bb,bold] #S #[default]'
set -g status-right '#[fg=colour244] %Y-%m-%d %H:%M '

set -g "status-format[0]" '#[bg=#232530,fg=#c5c8c6,fill=#232530]#[align=left] #[bold]#S#[nobold]#{?window_zoomed_flag, #[fg=#b294bb]ZOOM#[default],}  #[fg=colour240]#{pane_current_path} #[default]'


# ------------------------------------------------------------
#  十二、插件
# ------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# 不设置 @tpm-install / @tpm-update / @tpm-clean

set -g @resurrect-capture-pane-contents 'on'

# resurrect 避免前缀冲突
set -g @resurrect-save    'C-y'
set -g @resurrect-restore 'C-r'

# 每 5 分钟自动保存
set -g @continuum-save-interval '5'
set -g @continuum-restore 'off'

# 必须在文件最底部
run '~/.tmux/plugins/tpm/tpm'
